name: Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      refresh_baselines:
        description: Generate a baseline artifact instead of checking committed thresholds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmarks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_baselines && 'Capture benchmark baselines' || 'Package benchmarks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWIFT_DETERMINISTIC_HASHING: "1"

    steps:
    - uses: actions/checkout@v5
    - name: Test baseline coverage gate
      run: python3 Benchmarks/Scripts/test_baseline_coverage.py
    - name: Get swift version
      run: swift --version
    - name: Install benchmark system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjemalloc-dev
    - name: Fetch reference corpus
      run: Benchmarks/Scripts/fetch-reference-corpus.sh
    - name: Check baseline coverage
      id: baselines
      run: |
        if Benchmarks/Scripts/check-baseline-coverage.sh; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
        else
          status=$?
          if [[ $status -ne 1 ]]; then
            exit "$status"
          fi
          echo "complete=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Generate benchmark baselines
      if: ${{ steps.baselines.outputs.complete == 'false' || (github.event_name == 'workflow_dispatch' && inputs.refresh_baselines) }}
      working-directory: Benchmarks
      run: |
        swift package --disable-automatic-resolution --allow-writing-to-package-directory benchmark \
          thresholds update \
          --metric mallocCountTotal \
          --path Baselines \
          --no-progress
    - name: Run OrderedJSON benchmarks
      if: ${{ steps.baselines.outputs.complete == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.refresh_baselines) }}
      run: Benchmarks/Scripts/check-thresholds.sh OrderedJSONBenchmarks
    - name: Run JSONSchema benchmarks
      if: ${{ !cancelled() && steps.baselines.outputs.complete == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.refresh_baselines) }}
      run: Benchmarks/Scripts/check-thresholds.sh JSONSchemaBenchmarks
    - name: Upload benchmark baselines
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-baselines-${{ runner.os }}-${{ runner.arch }}
        path: Benchmarks/Baselines/*.json
