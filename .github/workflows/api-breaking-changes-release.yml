name: API breaking changes (release)

# Cumulative API-breaking-change check — compares the current default branch
# (or any chosen ref) against the previous release tag. Runs on demand so we
# can audit what's accumulated since the last release before tagging the
# next one.

on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Ref to compare (defaults to main)"
        required: false
        default: "main"
      baseline_tag:
        description: "Baseline tag (defaults to latest vX.Y.Z)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diff:
    name: Diff ${{ inputs.head_ref }} vs release
    # macos-26 — see api-breaking-changes.yml for the rationale.
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Check out scan tooling
        uses: actions/checkout@v5
        with:
          # head_ref may be an old release that predates the shared script.
          ref: ${{ github.workflow_sha }}
          path: .api-checks
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check scan result handling
        run: python3 -m unittest discover -s .api-checks/.github/scripts -p 'test_api_compatibility.py'

      - name: Resolve baseline tag
        id: baseline
        env:
          BASELINE: ${{ inputs.baseline_tag }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          if [ -z "$BASELINE" ]; then
            BASELINE=$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          fi
          if [ -z "$BASELINE" ]; then
            echo "::error::No baseline tag found (no vX.Y.Z tags exist)."
            exit 1
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "Comparing $(git rev-parse --short HEAD) ($HEAD_REF) against $BASELINE"

      - name: Diagnose API breaking changes
        id: diagnose
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          set +e
          swift package diagnose-api-breaking-changes "$BASELINE" > diagnose.log 2>&1
          EXIT_CODE=$?
          set -e
          cat diagnose.log
          python3 .api-checks/.github/scripts/api-compatibility.py "$EXIT_CODE"

      - name: Job summary
        if: always()
        env:
          HEAD_REF: ${{ inputs.head_ref }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          STATUS: ${{ steps.diagnose.outputs.status }}
          COUNT: ${{ steps.diagnose.outputs.count }}
        run: |
          {
            echo "## Cumulative API breaking-change report"
            printf '\n**Head:** `%s`\n**Baseline:** `%s`\n\n' "$HEAD_REF" "$BASELINE"
            case "$STATUS" in
              clean) echo "_No breaking changes since the baseline._" ;;
              breaking)
                echo "**Breakages found:** $COUNT"
                printf '\n```text\n'
                cat api-findings.txt
                printf '\n```\n\n'
                echo "These cumulative public API changes would ship in the next release."
                ;;
              *)
                echo "### API compatibility scan could not complete"
                echo "API compatibility is unknown. See the diagnostic logs."
                ;;
            esac
          } > api-report.md
          {
            cat api-report.md
            if [ -f diagnose.log ]; then
              printf '\n<details><summary>Digester output (last 500 lines)</summary>\n\n```text\n'
              tail -500 diagnose.log
              printf '\n```\n</details>\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-diagnostics
          path: |
            api-report.md
            diagnose.log
