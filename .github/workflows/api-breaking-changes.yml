name: API breaking changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect:
    name: Detect API breaking changes
    # macos-26 (Swift 6.2+) — `macos-latest` currently resolves to an image
    # with Swift 6.1.2, which has a known buggy API digester that emits
    # "X has been removed" for every public symbol regardless of the
    # actual diff. Pinning to macos-26 dodges that without going to xl.
    runs-on: macos-26

    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          # Need the full history for the baseline branch.
          fetch-depth: 0
          submodules: recursive

      - name: Check scan result handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_api_compatibility.py'

      - name: Get Swift / Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve baseline (PR base branch)
        id: baseline
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # Only changes introduced by this PR; cumulative-since-release
          # changes are checked by api-breaking-changes-release.yml.
          echo "baseline=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Comparing against: $BASE_REF"

      - name: Diagnose API breaking changes
        id: diagnose
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        # Completed scans with intentional breaks succeed; incomplete scans fail.
        run: |
          set +e
          swift package diagnose-api-breaking-changes "$BASELINE" > diagnose.log 2>&1
          EXIT_CODE=$?
          set -e
          cat diagnose.log
          python3 .github/scripts/api-compatibility.py "$EXIT_CODE"

      - name: Job summary and comment body
        if: always()
        env:
          STATUS: ${{ steps.diagnose.outputs.status }}
          COUNT: ${{ steps.diagnose.outputs.count }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          {
            case "$STATUS" in
              clean) echo "### No public API breaking changes introduced" ;;
              breaking)
                echo "### Public API breaking changes introduced ($COUNT)"
                printf '\n```text\n'
                cat api-findings.txt
                printf '\n```\n\n'
                echo "Intentional breaks are allowed. Otherwise, restore the symbols or add deprecation shims."
                ;;
              *)
                echo "### API compatibility scan could not complete"
                echo "API compatibility is unknown; existing labels are unchanged."
                ;;
            esac
            printf '\nCompared against `%s` using `swift package diagnose-api-breaking-changes`.\n\n' "$BASELINE"
            echo "This check shows changes introduced by this PR; cumulative changes are reviewed at release time."
            echo "See the job summary and api-compatibility-diagnostics artifact for diagnostic logs."
          } > api-report.md
          {
            cat api-report.md
            if [ -f diagnose.log ]; then
              printf '\n<details><summary>Digester output (last 500 lines)</summary>\n\n```text\n'
              tail -500 diagnose.log
              printf '\n```\n</details>\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-diagnostics
          path: |
            api-report.md
            diagnose.log

      - name: Update sticky PR comment
        # Fork and Dependabot tokens cannot write comments or labels.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-breaking-changes
          path: api-report.md

      - name: Add or remove `breaking-change` label
        if: >-
          success() &&
          (steps.diagnose.outputs.status == 'clean' || steps.diagnose.outputs.status == 'breaking') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        run: |
          # Make sure the label exists (idempotent).
          gh label create breaking-change \
            --repo "$REPO" \
            --color "B60205" \
            --description "Public API breaking change detected by CI" 2>/dev/null || true

          if [ "$STATUS" = "clean" ]; then
            # Remove if present; ignore 404 if not present.
            gh pr edit "$PR" --repo "$REPO" --remove-label "breaking-change" 2>/dev/null || true
          else
            gh pr edit "$PR" --repo "$REPO" --add-label "breaking-change"
          fi
